# (b) The standing assembly test case (founder, 2026-11-19): 1:3 spur gear pair, m2, 20/60 teeth, Ø20 shafts,
# four 6204 bearings, no housing. Brief verbatim from the live run (docs/reports/assembly-fix/live-gear-run.md).
# Hand values (tests/test_office_shaft_line.py, the plan in b_gear_pair.plan.json):
#   centre distance a = m (z1 + z2) / 2 = 2 (20 + 60) / 2 = 80; input shaft axis X = 0, output X = 80, both on Z = 0
#   shafts along +Y; gears on the mesh plane Y = 0, face 10 m = 20: both gears Y -10 .. 10
#   6204 (ISO 15): d 20, D 47, B 14; one bearing either side of the gears, 5 mm clear of the gear faces:
#   -Y bearing Y -10 - 5 - 14 = -29 .. -15, +Y bearing 15 .. 29; Fitz seats each at its base face:
#   (0, -29, 0), (0, 15, 0), (80, -29, 0), (80, 15, 0)
id = "gear-pair"
title = "1:3 spur gear pair, four 6204, no housing"
letter = "b"
source = "Founder's standing assembly test case (CONTEXT.md, 2026-11-19)"
brief = "Simple spur gear pair, ratio 1:3, with only shafts and bearings. Pinion module 2, 20 teeth; gear 60 teeth. Shafts Ø20 at the bearings; four 6204 bearings, two per shaft. No housing."

[sim]
plan = "b_gear_pair.plan.json"   # Archie's plan, replayed (no AI)

[limits]
tokens = 30
wall_simulated_s = 150
wall_live_s = 480

[expect]
complete = true
light = true                     # 5 part lines, 8 pieces: small (PD-93)
parts = 5                        # part lines of the replayed plan (a live planner may split the bearings)
pieces = 8
only_simulated = ["parts"]
kinds = { gear = 2, shaft = 2, bearing = 4 }  # pieces: two gears, two shafts, four bearings
no_extras = true                 # no housing, plate or support
instances = 8
clashes = 0
binned = 0
loose = 0
placeholders = 0
blocked = 0
icd_problems = 0
conformance = true
direct_min = 4                   # both shafts and both gears built without AI (from the interfaces or the Toolbox)

[[expect.distance]]
a = { kind = "gear", pick = "smallest" }   # the pinion
b = { kind = "gear", pick = "largest" }    # the gear
value = 80.0                     # a = m (z1 + z2) / 2 = 2 x 80 / 2
plane = "xz"                     # between the shaft axes (the axes run along Y)
tol = 0.01

[[expect.at]]
kind = "bearing"
at = [[0.0, -29.0, 0.0], [0.0, 15.0, 0.0], [80.0, -29.0, 0.0], [80.0, 15.0, 0.0]]
tol = 0.01
modes = ["simulated"]

[[expect.same_span]]
a = { kind = "gear", pick = "smallest" }   # coplanar gears: the same face span along the shaft axis
b = { kind = "gear", pick = "largest" }
axis = "y"
tol = 0.01
