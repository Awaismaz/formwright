# (i) Master path: a NEMA 17 stepper on a custom adapter plate, screwed to the upright of an L bracket (WORKLIST 50).
# The fast path stacks the plate flat on the bracket and the motor on the plate with two M3 bolts each. Hand values
# (master frame: datum A on the top of the bracket envelope, Z = 76 in the master, so subtract 76):
#   bracket: foot 80 x 60 x 6, upright 80 x 14 x 70 at the back: Z -76 .. 0, Y -30 .. 30
#   plate 80 x 5 x 60 standing on the foot (Z 6 - 76 = -70) against the upright (Y 16): Y 11 .. 16, Z -70 .. -10
#   motor 42.3 square x 48 on the plate's front face: Y 11 - 48 = -37 .. 11, axis at Z 36 - 76 = -40:
#   Z -40 ± 21.15 = -61.15 .. -18.85
#   four M3 SHCS (motor, 31 mm square) and four M4 SHCS (plate to upright, 60 x 40 pattern); no nuts; tapped depths
#   give Fitz's 2 d thread engagement (M3: 8 deep, M4: 12 deep; ISO 4762 M3 x 12 and M4 x 16 fit)
id = "motor-adapter"
title = "Stepper motor on a custom adapter plate"
letter = "i"
source = "WORKLIST 50 master-path case (hand-written reference plan and master)"
brief = "A NEMA 17 stepper motor mounted on a custom 5 mm aluminium adapter plate, which is screwed to the upright of an L-shaped mounting bracket (foot 80 x 60 x 6 mm, upright 70 mm high and 14 mm thick). The motor bolts to the plate with four M3 x 12 screws on the 31 mm square pattern; the plate bolts to the bracket upright with four M4 x 16 screws."

[sim]
plan = "i_motor_adapter.plan.json"
master = "i_motor_adapter.master.py"
intent = "i_motor_adapter.intent.json"  # with FW_DESIGN_GRAPH=1: a hand-written graph reply, replayed

[limits]
tokens = 120
wall_simulated_s = 300
wall_live_s = 900

[expect]
path = "master"
complete = true
parts = 5
pieces = 11
kinds = { support = 1, plate = 1, motor = 1, fastener = 8 }
no_extras = true
clashes = 0
binned = 0
loose = 0
placeholders = 0
blocked = 0
icd_problems = 0
conformance = true

[[expect.span]]
name = "(?i)bracket"
axis = "z"
min = -76.0
max = 0.0
tol = 0.01

[[expect.span]]
name = "(?i)adapter plate"
axis = "y"
min = 11.0               # against the upright's front face (Y 16)
max = 16.0
tol = 0.01

[[expect.span]]
name = "(?i)adapter plate"
axis = "z"
min = -70.0              # standing on the foot
max = -10.0
tol = 0.01

[[expect.span]]
name = "(?i)stepper motor"
axis = "y"
min = -37.0
max = 11.0
tol = 0.01

[[expect.span]]
name = "(?i)stepper motor"
axis = "z"
min = -61.15
max = -18.85
tol = 0.01

[[expect.stacks]]
style = "shcs"
size = 3
n = 4

[[expect.stacks]]
style = "shcs"
size = 4
n = 4
