<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23272E" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Offline · Formwright</title>
  <style>
    :root { color-scheme: light dark; --bg: #ECEEF1; --panel: #FFFFFF; --text: #1C2129; --muted: #626C7C; --border: #D6DBE2; --primary: #1F5FBF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16191E; --panel: #1F232A; --text: #E6EAF0; --muted: #96A0AF; --border: #373E49; --primary: #5691EB; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; text-align: center; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
    svg { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 14px 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px; border-radius: 6px;
      background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
    .status { margin-top: 14px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="#1F5FBF"/><path d="M16 2.5 27.7 9.25 16 16 4.3 9.25z" fill="#5C93E6"/><path d="M16 16 27.7 9.25v13.5L16 29.5z" fill="#174A96"/><path d="M8.2 11.1 16 6.6l3.2 1.85-7.8 4.5v3.4l5.6-3.2 3.2 1.85-8.8 5.05v4.6L8.2 21.8z" fill="#fff"/><path d="m22.6 15.3 5.1-2.95v4.6l-5.1 2.95z" fill="#C8742E"/></svg>
    <h1>You're offline</h1>
    <p>Your projects are safe. Reconnect to keep designing.</p>
    <a class="btn" href="" id="retry">Try again</a>
    <div class="status" id="status" role="status" aria-live="polite">Formwright reloads by itself when you are back online.</div>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
