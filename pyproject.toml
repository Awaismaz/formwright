[project]
name = "aicad"
version = "0.0.1"
description = "AI-native engineering design platform (M0 spike)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
]

[project.scripts]
aicad = "aicad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
